<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Vahid</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/brands.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css"
		/>
		<link rel="stylesheet" href="/assets/style.css" />
		<link rel="icon" href="/assets/favicon/favicon.ico" sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/assets/favicon/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/assets/favicon/favicon-16x16.png"
		/>
	</head>
	<body>
		<main>
			<nav class="social-links">
				<a
					href="https://github.com/va9id"
					aria-label="GitHub"
					target="_blank"
				>
					<i class="fa-brands fa-github"></i>
				</a>
				<a
					href="https://linkedin.com/in/fvahid"
					aria-label="LinkedIn"
					target="_blank"
				>
					<i class="fa-brands fa-linkedin"></i>
				</a>
			</nav>
			<picture>
				<source
					media="(prefers-color-scheme: dark)"
					srcset="
						https://raw.githubusercontent.com/va9id/va9id/main/contributions-dark.svg
					"
				/>
				<img
					alt="Contribution graph"
					src="https://raw.githubusercontent.com/va9id/va9id/main/contributions.svg"
					style="width: 100%; height: auto"
				/>
			</picture>
		</main>
	</body>
</html>
